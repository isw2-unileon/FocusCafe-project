name: E2E Tests

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest

    #Simutates a local supabase db
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: make install-e2e

      - name: Build frontend
        run: make build-frontend

      # Execute Supabase CLI in Postgres Github & Load Seed Data
      - name: Run Database Migrations and Seed
        env:
          PGSSLMODE: disable
        run: |
          # 1. Install Supabase CLI
          npm install -g supabase

          # 2. Create extensions and auth schemas with dumy users table
          echo "Creating extensions schema..."
          supabase db query "CREATE SCHEMA IF NOT EXISTS extensions;" --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable"

          echo "Creating auth schema..."
          supabase db query "CREATE SCHEMA IF NOT EXISTS auth;" --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable"

          echo "Creating dummy auth.users table..."
          supabase db query "CREATE TABLE IF NOT EXISTS auth.users (id UUID PRIMARY KEY);" --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable"

          # 3. Push database migrations (Adding --accept-all to bypass the [Y/n] prompt)
          echo "Pushing database migrations..."
          yes | supabase db push --db-url "postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable"

          # 4. Inject seed.sql file
          echo "Loading initial coffee menu data (seed.sql)..."
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable" -f supabase/seed.sql

      - name: Create .env file securely
        run: |
          echo "PORT=8080" >> .env
          echo "GIN_MODE=debug" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> .env

          echo "PORT=8080" >> e2e/.env
          echo "GIN_MODE=debug" >> e2e/.env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> e2e/.env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> e2e/.env
          echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}" >> e2e/.env

      # Playwright turns on frontend and backend automatically
      - name: Run E2E tests
        run: make e2e
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
