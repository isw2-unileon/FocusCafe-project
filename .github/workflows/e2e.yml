name: E2E Tests

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest

    #Simutates a local supabase db
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: make install-e2e

      - name: Build frontend
        run: make build-frontend

      # Execute Supabase CLI in Postgres Github
      - name: Run Database Migrations
        run: |
          npm install -g supabase
          supabase db reset --yes --db-url "postgresql://postgres:postgres@localhost:54322/postgres?sslmode=disable"

      # Playwright turns on frontend and backend automatically
      - name: Run E2E tests
        run: make e2e
        env:
          CI: true
          PORT: 8080
          GIN_MODE: release
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres?sslmode=disable
          SUPABASE_URL: http://localhost:54321
          SUPABASE_KEY: mock-key-for-testing

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
