name: E2E Tests

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest

    # No services needed here because "supabase start" will spin up everything (GoTrue, Postgres, Storage, etc.)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: make install-e2e

      - name: Build frontend
        run: make build-frontend

      # Spin up the official local Supabase ecosystem (including Auth on 54321 and DB on 54322)
      - name: Start Supabase Local Ecosystem
        run: |
          # 1. Install Supabase CLI
          npm install -g supabase

          # 2. Initialize and start the local cluster
          supabase start

      # Seed the local Postgres container with your coffee menu
      - name: Run Database Seed
        env:
          PGSSLMODE: disable
        run: |
          echo "Loading initial coffee menu data into the LOCAL database..."
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable" -f supabase/seed.sql

      # Dynamically build the .env files using LOCAL credentials only
      - name: Create Local .env Files
        run: |
          # Standard Supabase local development fallback keys 
          # (These match what 'supabase start' uses internally)
          LOCAL_DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable"
          LOCAL_SUPABASE_URL="http://127.0.0.1:54321"
          LOCAL_ANON_KEY="sb_publishable_local_development_key_mock_value_for_testing_purposes"
          LOCAL_JWT_SECRET="sb_secret_local_development_key_mock_value_for_testing_purposes"

          # 1. Create root .env for the Go Backend (pointing to local containers)
          echo "PORT=8080" >> .env
          echo "GIN_MODE=debug" >> .env
          echo "CORS_ALLOW_ORIGIN=*" >> .env
          echo "DATABASE_URL=$LOCAL_DB_URL" >> .env
          echo "SUPABASE_URL=$LOCAL_SUPABASE_URL" >> .env
          echo "SUPABASE_KEY=$LOCAL_JWT_SECRET" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=$LOCAL_ANON_KEY" >> .env
          # We keep the Gemini API secret since it's an external third-party service
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

          # 2. Duplicate it for the e2e automation folder
          cp .env e2e/.env

          # 3. Create frontend/.env for the Vite UI application
          echo "BACKEND_PORT=8080" >> frontend/.env
          echo "VITE_API_URL=http://localhost:8080/api" >> frontend/.env
          echo "VITE_SUPABASE_URL=$LOCAL_SUPABASE_URL" >> frontend/.env
          echo "VITE_SUPABASE_ANON_KEY=$LOCAL_ANON_KEY" >> frontend/.env

      # Playwright turns on frontend and backend automatically
      - name: Run E2E tests
        run: make e2e
        env:
          CI: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
